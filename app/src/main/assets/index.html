<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>autosync</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<main id="home" class="screen">
  <header class="top">
    <h1>autosync</h1>
    <button class="icon" aria-label="설정" data-go="settings"><svg><use href="#i-gear"/></svg></button>
  </header>
  <nav class="tabs" id="modeTabs" aria-label="모드">
    <button data-mode="false">보내는 폰</button>
    <button data-mode="true">받는 폰</button>
    <span class="bar"></span>
  </nav>
  <div class="body" id="homeBody">
    <div class="ring" role="img" id="ring">
      <svg viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="111"/><circle class="fill" id="ringFill" cx="120" cy="120" r="111"/></svg>
      <div class="center">
        <span class="big" id="ringBig">0</span>
        <span class="small" id="ringSmall"></span>
      </div>
    </div>
    <div class="chip" id="chip"><svg id="chipIc"><use href="#i-cloud"/></svg><span id="chipText"></span></div>
    <div class="collapse" id="stepsBox"><div><div class="steps" id="steps"></div></div></div>
    <div class="collapse" id="filesBox"><div><div class="files" id="files"></div></div></div>
    <div class="rows" id="homeRows"></div>
  </div>
  <button class="primary bottom" id="mainBtn"></button>
</main>

<section class="screen page" id="recent">
  <header class="top"><button class="icon back" aria-label="뒤로"><svg><use href="#i-back"/></svg></button><h1>최근 변경사항</h1></header>
  <nav class="tabs" id="recentTabs"><button data-t="0"></button><button data-t="1"></button><span class="bar"></span></nav>
  <div class="pills" id="rangePills"><button data-r="today">오늘</button><button data-r="all">전체</button><span class="plate"></span></div>
  <div class="headline"><span class="big" id="recentCount"></span><span id="recentSize"></span></div>
  <div class="rows" id="recentList"></div>
</section>

<section class="screen page" id="folders">
  <header class="top"><button class="icon back" aria-label="뒤로"><svg><use href="#i-back"/></svg></button><h1>보낼 폴더</h1></header>
  <div class="rows" id="folderList"></div>
  <button class="add" data-act="addFolder"><svg><use href="#i-plus"/></svg>폴더 추가</button>
  <h2>한 번만 보내기</h2>
  <div class="rows">
    <button class="row" data-act="pickFiles"><svg class="ic"><use href="#i-image"/></svg><span class="label">파일 고르기</span><svg class="chev"><use href="#i-chev"/></svg></button>
    <button class="row last" data-act="pickFolder"><svg class="ic"><use href="#i-folder"/></svg><span class="label">폴더 고르기</span><svg class="chev"><use href="#i-chev"/></svg></button>
  </div>
</section>

<section class="screen page" id="settings">
  <header class="top"><button class="icon back" aria-label="뒤로"><svg><use href="#i-back"/></svg></button><h1>설정</h1></header>
  <div class="rows">
    <button class="row" data-sw="auto"><svg class="ic"><use href="#i-clock"/></svg><span class="label" id="autoLabel">자동 보내기</span><span class="sw"><span class="k"></span></span></button>
    <button class="row" data-sw="wifiOnly"><svg class="ic"><use href="#i-wifi"/></svg><span class="label">와이파이에서만</span><span class="sw"><span class="k"></span></span></button>
    <button class="row" data-sw="chargingOnly"><svg class="ic"><use href="#i-bolt"/></svg><span class="label">충전 중에만</span><span class="sw"><span class="k"></span></span></button>
    <button class="row last" data-pick="concurrency"><svg class="ic"><use href="#i-layers"/></svg><span class="label">동시 전송</span><span class="val" id="vConcurrency"></span><svg class="chev"><use href="#i-chev"/></svg></button>
  </div>
  <h2>보내는 폰</h2>
  <div class="rows">
    <button class="row" data-sw="deleteAfter"><svg class="ic"><use href="#i-trash"/></svg><span class="label">보낸 후 삭제</span><span class="sw"><span class="k"></span></span></button>
    <button class="row last" data-time="up"><svg class="ic"><use href="#i-clock"/></svg><span class="label">예약 업로드</span><span class="val" id="vUp"></span><svg class="chev"><use href="#i-chev"/></svg></button>
  </div>
  <h2>받는 폰</h2>
  <div class="rows">
    <button class="row" data-pick="minFreeGb"><svg class="ic"><use href="#i-hdd"/></svg><span class="label">받기 중지</span><span class="val" id="vMinFree"></span><svg class="chev"><use href="#i-chev"/></svg></button>
    <button class="row last" data-time="down"><svg class="ic"><use href="#i-clock"/></svg><span class="label">예약 다운로드</span><span class="val" id="vDown"></span><svg class="chev"><use href="#i-chev"/></svg></button>
  </div>
  <h2>계정</h2>
  <div class="rows">
    <button class="row" data-act="signIn"><svg class="ic"><use href="#i-user"/></svg><span class="label">구글 계정</span><span class="val" id="vAccount"></span><svg class="chev"><use href="#i-chev"/></svg></button>
    <button class="row last" data-go="log"><svg class="ic"><use href="#i-list"/></svg><span class="label">기록</span><svg class="chev"><use href="#i-chev"/></svg></button>
  </div>
</section>

<section class="screen page" id="log">
  <header class="top"><button class="icon back" aria-label="뒤로"><svg><use href="#i-back"/></svg></button><h1>기록</h1><button class="text" data-act="copy" id="copyBtn">복사</button></header>
  <pre id="logText"></pre>
</section>

<div class="dim" id="dim"></div>

<section class="sheet" id="subSheet" aria-label="보낼 곳">
  <span class="grip"></span>
  <div class="sheetTitle"><span id="subFrom"></span><svg><use href="#i-arrow"/></svg><b>PixelSync /</b></div>
  <div class="opts" id="subOpts"></div>
  <label class="newFolder" id="newFolder"><svg><use href="#i-plus"/></svg><input id="newName" placeholder="새 폴더" maxlength="40"></label>
  <div class="btns"><button class="secondary" id="removeFolder">빼기</button><button class="primary" id="saveSub">저장</button></div>
</section>

<section class="sheet" id="timeSheet" aria-label="예약">
  <span class="grip"></span>
  <div class="sheetTitle"><svg><use href="#i-clock"/></svg><b id="timeTitle"></b></div>
  <div class="times">
    <label><span>시작</span><input type="time" id="tStart"></label>
    <label><span>끝</span><input type="time" id="tEnd"></label>
  </div>
  <div class="btns"><button class="secondary" id="timeOff">예약 끄기</button><button class="primary" id="timeSave">저장</button></div>
</section>

<section class="sheet" id="pickSheet" aria-label="고르기">
  <span class="grip"></span>
  <div class="sheetTitle"><b id="pickTitle"></b></div>
  <div class="pills big" id="pickPills"><span class="plate"></span></div>
</section>

<section class="dialog" id="cancelDialog" role="dialog" aria-label="취소 확인">
  <span class="dIcon red"><svg><use href="#i-stop"/></svg></span>
  <b id="cancelTitle">보내기를 취소할까요?</b>
  <div class="btns"><button class="secondary" id="keepGoing">계속</button><button class="primary danger" id="doCancel">취소하기</button></div>
</section>

<section class="dialog" id="askDialog" role="dialog" aria-label="처음 시작 질문">
  <span class="dIcon"><svg><use href="#i-trash"/></svg></span>
  <b>보낸 뒤 폰에서 지울까요?</b>
  <span class="tip">설정에서 언제든 바꿀 수 있어요</span>
  <div class="btns"><button class="secondary" data-ask="false">남기기</button><button class="primary" data-ask="true">지우기</button></div>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5z"/><path d="M2 13l10 5 10-5"/></symbol>
  <symbol id="i-hdd" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18M7 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
  <symbol id="i-sd" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M10 7v3M13 7v3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
</svg>

<script src="app.js"></script>
</body>
</html>
